[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simgrasp3d-lab"
version = "0.12.0"
description = "以 Python 學習 3D 感知、柔性物理、機械手與安全抓取模擬"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "zack7515" }]
dependencies = [
  "mujoco>=3.12,<4",
  "numpy>=2.0,<3",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
simgrasp3d = "simgrasp3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simgrasp3d.visualization" = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 全形標點與中文說明是本專案的既定風格；行寬對混排 CJK 的字元計數也沒有意義。
# RUF046：本專案大量流通 numpy 純量，round() 不保證回傳 int，int() 轉型是必要的。
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF046"]

[tool.ruff.lint.isort]
known-first-party = ["simgrasp3d"]
