[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simgrasp3d-lab"
version = "0.8.0"
description = "以 Python 學習 3D 感知、柔性物理、機械手與安全抓取模擬"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "zack7515" }]
dependencies = [
  "mujoco>=3.12,<4",
  "numpy>=2.0,<3",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
simgrasp3d = "simgrasp3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
